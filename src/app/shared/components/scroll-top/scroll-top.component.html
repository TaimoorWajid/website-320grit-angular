<button
  type="button"
  class="scroll-top"
  [class.is-visible]="visible()"
  [attr.aria-hidden]="visible() ? null : 'true'"
  [attr.tabindex]="visible() ? null : -1"
  aria-label="Scroll to top"
  (click)="scrollToTop()"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M5 15l7-7 7 7" />
  </svg>
</button>
