<section class="ca-cta" id="ca-cta">
  <div class="ca-cta-bg" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1920&q=85"
      alt=""
      width="1920"
      height="800"
      loading="lazy"
    />
  </div>
  <div class="ca-cta-overlay" aria-hidden="true"></div>
  <div class="ca-container ca-cta-inner" caReveal="up">
    <h2 class="ca-display">Build What’s Next<br /><span class="ca-accent">in California.</span></h2>
    <p class="ca-lead">Have a project taking shape in California? Let’s talk about what it will take to deliver it well.</p>
    <app-ca-button [link]="cta" />
  </div>
</section>
