<section class="ca-section ca-faq" id="ca-faq">
  <div class="ca-container">
    <div class="ca-section-head" caReveal="up">
      <h2 class="ca-h2">California <span [style.color]="'#792CD5'">FAQ</span></h2>
    </div>
    <div class="ca-faq-grid" caReveal="up">
      @for (f of faqs(); track f.q; let i = $index) {
        <div class="ca-faq-item" [class.is-open]="openIndex() === i">
          <button type="button" class="ca-faq-q" [attr.aria-expanded]="openIndex() === i" (click)="toggle(i)">
            <span>{{ f.q }}</span>
            <span class="ca-faq-icon" aria-hidden="true">+</span>
          </button>
          <div class="ca-faq-a">
            <p>{{ f.a }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
