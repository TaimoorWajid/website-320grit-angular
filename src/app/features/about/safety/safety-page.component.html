<div class="about-page">
  <app-about-hero [hero]="HERO" />
  <app-value-grid
    sectionId="safe-approach"
    background="#0A0A0A"
    [header]="{
      label: 'Our Safety Approach',
      title: 'Safety by Design.<br>Built into Everything We Do.',
      text: 'A construction safety program built for real jobsites: site-specific planning, OSHA-compliant training, daily field enforcement, and a culture where every worker owns safety\u2014from preconstruction through closeout.',
      centered: false,
      maxWidth: '560px',
    }"
    [cards]="APPROACH"
    columns="repeat(4, 1fr)"
  />
  <app-split-section [split]="CULTURE" />
  <app-value-grid
    sectionId="safe-focus"
    background="#050505"
    [header]="{ label: 'Our Focus Areas', title: 'Focused on What Matters Most', centered: true }"
    [cards]="FOCUS"
    columns="repeat(6, 1fr)"
  />
  <app-final-cta sectionId="safe-cta" [title]="CTA.title" [text]="CTA.text" [cta]="CTA.cta" />
</div>
