<div class="about-page">
  <app-about-hero [hero]="HERO" />
  <app-value-grid
    sectionId="qual-commit"
    background="#0A0A0A"
    [header]="{ label: 'Our Commitment to Quality', centered: true }"
    [cards]="COMMITMENT"
    columns="repeat(5, 1fr)"
  />
  <app-project-grid sectionId="qual-details" [light]="true" [cards]="DETAILS" columns="repeat(3, 1fr)" />
  <section class="hc-section" id="qual-quote" [style.background]="'#050505'">
    <div class="hc-container" [style.text-align]="'center'">
      <div hcReveal [style.max-width]="'640px'" [style.margin-inline]="'auto'">
        <p
          [style.font-size]="'1.35rem'"
          [style.font-style]="'italic'"
          [style.color]="'#bbbbbb'"
          [style.line-height]="'1.6'"
        >
          “Quality is never an accident. It is always the result of intelligent effort.”
        </p>
        <cite
          [style.display]="'block'"
          [style.margin-top]="'1rem'"
          [style.font-size]="'0.9rem'"
          [style.color]="'#7a7a7a'"
          [style.font-style]="'normal'"
          >— John Ruskin</cite
        >
      </div>
      <div
        class="ab-value-grid"
        [style.grid-template-columns]="'repeat(4, 1fr)'"
        [style.margin-top]="'3rem'"
        [style.max-width]="'800px'"
        [style.margin-inline]="'auto'"
        hcReveal
      >
        @for (f of FOUNDATIONS; track f.title) {
          <div class="ab-value-card">
            <div class="ab-value-icon" [innerHTML]="foundationIcon(f.icon) | safeHtml" aria-hidden="true"></div>
            <h3>{{ f.title }}</h3>
          </div>
        }
      </div>
    </div>
  </section>
</div>
