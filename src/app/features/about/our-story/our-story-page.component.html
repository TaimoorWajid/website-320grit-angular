<div class="about-page">
  <app-about-hero [hero]="HERO" />
  <app-split-section [split]="BEGAN" />
  <app-value-grid
    sectionId="story-values"
    background="#050505"
    [header]="{ title: 'Our Values. Our Foundation.', centered: true }"
    [cards]="VALUES"
    columns="repeat(5, 1fr)"
  />
  <app-timeline
    sectionId="story-milestones"
    background="#0A0A0A"
    label="Key Milestones"
    title="A Track Record of Growth"
    text="Over the years, we’ve taken on bigger challenges, expanded our capabilities, and built a legacy of results."
    [cta]="milestonesCta"
    [items]="MILESTONES"
  />
  <app-split-section [split]="PURPOSE" />
</div>
