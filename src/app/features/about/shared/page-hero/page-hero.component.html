<section class="hc-hero rr-hero" [id]="hero().id">
  <div class="hc-hero-bg" aria-hidden="true">
    <img
      [src]="hero().image.src"
      [alt]="hero().image.alt"
      width="1920"
      height="1080"
      [attr.fetchpriority]="hero().image.fetchPriority ?? 'high'"
    />
  </div>
  <div class="hc-hero-overlay rr-hero-overlay" aria-hidden="true"></div>
  <div class="hc-hero-content" hcReveal>
    <span class="grit-eyebrow">{{ hero().label }}</span>
    <h1 class="hc-display-xl" [innerHTML]="hero().title"></h1>
    <p class="rr-hero-desc" [style.max-width]="hero().descriptionWidth ?? '520px'">{{ hero().description }}</p>
    @if (hero().ctas?.length) {
      <div class="hc-hero-actions">
        @for (cta of hero().ctas; track cta.label) {
          @if (cta.href === '#contact') {
            <a routerLink="/contact-us" class="btn-explore"><span>{{ cta.label }}</span><span class="btn-explore-dash" aria-hidden="true">—</span></a>
          } @else if (cta.href.startsWith('#')) {
            <a [href]="cta.href" (click)="scrollToHash($event, cta.href)" class="btn-explore"><span>{{ cta.label }}</span><span class="btn-explore-dash" aria-hidden="true">—</span></a>
          } @else {
            <a [routerLink]="cta.href" class="btn-explore"><span>{{ cta.label }}</span><span class="btn-explore-dash" aria-hidden="true">—</span></a>
          }
        }
      </div>
    }
  </div>
</section>
