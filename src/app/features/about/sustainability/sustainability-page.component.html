<div class="about-page">
  <app-about-hero [hero]="HERO" />
  <app-value-grid
    sectionId="sus-commit"
    background="#0A0A0A"
    [header]="{
      label: 'Our Commitment',
      title: 'Building Responsibly.<br>For Today and Tomorrow.',
      text: 'Sustainable construction, integrated from day one: responsible material sourcing, waste diversion planning, and energy-efficient delivery\u2014reducing environmental impact while delivering buildings that perform for decades.',
      centered: false,
      maxWidth: '560px',
    }"
    [cards]="COMMITMENT"
    columns="repeat(4, 1fr)"
  />
  <app-split-section [split]="HOW" />
  <app-project-grid
    sectionId="sus-projects"
    background="#050505"
    [header]="{ label: 'Sustainable in Action', title: 'Built Green. Built to Perform.', centered: false }"
    [cards]="PROJECTS"
    columns="repeat(3, 1fr)"
  />
  <app-final-cta sectionId="sus-cta" [title]="CTA.title" [text]="CTA.text" [cta]="CTA.cta" />
</div>
