<section class="locations-section" aria-label="Our locations">
  <div class="locations-layout">
    <div class="locations-text" [appReveal]="{ y: 40 }">
      <h2 class="locations-headline">NATIONWIDE PERSPECTIVE.</h2>
      <h2 class="locations-headline">CALIFORNIA ROOTS.</h2>
      <p class="locations-body">We coordinate teams, consultants, contractors, budgets, schedules, and project risks while representing the owner’s best interests throughout the entire project lifecycle.</p>
      <a href="" class="locations-cta" (click)="exploreMore($event)"><span class="link_text">Explore More</span></a>
    </div>
    <div class="locations-media" [appReveal]="{ y: 40, delay: 0.1 }">
      <img src="/assets/images/Nationwide-Map.webp" alt="" loading="lazy" decoding="async" />
    </div>
  </div>
</section>
