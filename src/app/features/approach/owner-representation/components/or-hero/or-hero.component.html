<section class="oc-hero" id="oc-hero" data-section="hero" ocParallax>
  <div class="oc-hero-bg" data-speed="0.35" aria-hidden="true">
    <img
      src="/assets/images/commercial-construction.webp"
      alt="Construction site under professional management"
      width="1920"
      height="1080"
      fetchpriority="high"
    />
  </div>
  <div class="oc-hero-overlay" aria-hidden="true"></div>
  <div class="oc-hero-glow" aria-hidden="true"></div>
  <div class="oc-container oc-hero-inner">
    <div class="oc-hero-content" ocReveal="up">
      <span class="grit-eyebrow">01 — Our Approach</span>
      <h1 class="oc-display">
        <span class="oc-line">Your Advocate.</span>
        <span class="oc-line oc-accent">From Vision to Keys.</span>
      </h1>
      <p class="oc-lead">
        320 Grit serves as your owner’s representative—an independent construction
        management expert who protects your budget, your schedule, and your interests
        on every decision, every day.
      </p>
      <div class="oc-hero-cta">
        <a href="#oc-pillars" class="btn-explore" (click)="scrollTo('#oc-pillars', $event)">
          <span>How We Protect You</span><span class="btn-explore-dash" aria-hidden="true">—</span>
        </a>
        <a routerLink="/contact-us" class="btn-explore">
          <span>Start a Project</span><span class="btn-explore-dash" aria-hidden="true">—</span>
        </a>
      </div>
    </div>
  </div>
  <div class="oc-scroll-hint" ocReveal="fade" aria-hidden="true">
    <span>Scroll</span>
    <span class="oc-scroll-line"></span>
  </div>
</section>
