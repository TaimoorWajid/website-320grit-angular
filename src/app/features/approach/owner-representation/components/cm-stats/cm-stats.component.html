<section class="cm-stats" aria-label="Owner representation track record">
  <div class="cm-stats__inner">
    @for (s of display(); track s.label; let i = $index) {
      <div class="cm-stats__item" [appReveal]="{ delay: i * 0.1 }">
        <p class="cm-stats__value">{{ format(s) }}</p>
        <p class="cm-stats__label">{{ s.label }}</p>
      </div>
    }
  </div>
</section>
