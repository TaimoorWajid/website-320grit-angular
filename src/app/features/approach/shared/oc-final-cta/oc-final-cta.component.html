<section class="oc-cta" id="oc-cta" ocParallax>
  <div class="oc-cta-bg" data-speed="0.25" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1920&q=85"
      alt=""
      width="1920"
      height="900"
      loading="lazy"
    />
  </div>
  <div class="oc-cta-overlay" aria-hidden="true"></div>
  <div class="oc-container oc-cta-inner" ocReveal="up">
    <h2 class="oc-display oc-cta-title">Your Vision.<br />One Team.<br /><span class="oc-accent">One Outcome.</span></h2>
    <p class="oc-lead">Let’s build the right team around your next project.</p>
    <app-oc-button [link]="cta" />
  </div>
</section>
