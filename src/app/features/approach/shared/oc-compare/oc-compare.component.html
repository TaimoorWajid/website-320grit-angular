<section class="oc-section oc-compare" id="oc-compare" data-section="compare">
  <div class="oc-container">
    <div class="oc-section-head" ocReveal="up">
      <span class="grit-eyebrow">05 — The Difference</span>
    </div>
    <div class="oc-compare-grid">
    <div class="oc-compare-panel oc-compare-bad" ocReveal="left">
      <div class="oc-compare-img">
        <img
          src="assets/images/oc-compare-alone.webp"
          alt="Project owner working alone late over drawings and schedules"
          width="600"
          height="400"
          loading="lazy"
        />
        <div class="oc-compare-overlay" aria-hidden="true"></div>
      </div>
      <div class="oc-compare-body">
        <h3>What Owners <span class="oc-x">Shouldn’t</span> Have to Do</h3>
        <ul class="oc-x-list">
          @for (item of shouldnt; track item) {
            <li><span class="oc-x-mark" aria-hidden="true">✕</span>{{ item }}</li>
          }
        </ul>
      </div>
    </div>

    <div class="oc-compare-divider" ocReveal="scale" aria-hidden="true">
      <span class="oc-compare-arrow">→</span>
    </div>

    <div class="oc-compare-panel oc-compare-good" ocReveal="right">
      <div class="oc-compare-img">
        <img
          src="assets/images/oc-compare-team.webp"
          alt="Construction management team walking a daylight jobsite"
          width="600"
          height="400"
          loading="lazy"
        />
        <div class="oc-compare-overlay oc-overlay-good" aria-hidden="true"></div>
      </div>
      <div class="oc-compare-body">
        <h3>What Owners <span class="oc-check">Should</span> Experience</h3>
        <ul class="oc-check-list">
          @for (item of should; track item) {
            <li><span class="oc-check-mark" aria-hidden="true">✓</span>{{ item }}</li>
          }
        </ul>
      </div>
    </div>
    </div>
  </div>
</section>
