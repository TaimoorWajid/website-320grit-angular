<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>320 Grit | Construction Consulting, Project Management &amp; Owner Representation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="320 Grit provides Bid-Build, Design-Build, Expert Witness, and Forensic Accounting services for complex construction projects.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* Startup loader: visible in the initial HTML before JavaScript starts,
       preventing a flash of page content. Mirrors the loader behavior of the
       reference architecture (progress milestones, dismissal triggers) with
       320 Grit branding. */
    #site-loader[hidden] {
      display: none;
    }
    #site-loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      background: #070707;
      color: #ffffff;
      font-family: "Instrument Sans", Arial, sans-serif;
      touch-action: none;
    }
    .loader-content {
      width: min(72vw, 320px);
      text-align: center;
    }
    .loader-logo {
      display: block;
      width: 100%;
      height: auto;
      animation: loader-breathe 1.8s ease-in-out infinite;
    }
    .loader-track {
      height: 2px;
      margin-top: 42px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: #792cd5;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }
    .loader-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a1a1aa;
    }
    .loader-percent {
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }
    .loader-skip {
      margin-top: 32px;
      padding: 12px;
      border: 0;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      text-underline-offset: 4px;
    }
    .loader-skip:hover {
      text-decoration: underline;
      color: #ffffff;
    }
    .loader-skip:focus-visible {
      outline: 2px solid #792cd5;
      outline-offset: 3px;
    }
    @keyframes loader-breathe {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.58;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #site-loader,
      .loader-fill {
        transition: none;
      }
      .loader-logo {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <noscript
    ><style>
      #site-loader {
        display: none;
      }
    </style></noscript
  >
  <div
    id="site-loader"
    role="dialog"
    aria-modal="true"
    aria-label="Loading 320 Grit"
  >
    <div class="loader-content">
      <img
        class="loader-logo"
        src="/assets/images/logo-master.png"
        width="2237"
        height="277"
        alt="320 Grit"
        fetchpriority="high"
      />
      <div
        class="loader-track"
        role="progressbar"
        aria-label="Page readiness"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="loader-fill"></div>
      </div>
      <div class="loader-meta">
        <span>Preparing your experience</span
        ><span class="loader-percent" aria-hidden="true">0%</span>
      </div>
      <button class="loader-skip" type="button">Continue to website</button>
    </div>
  </div>
  <app-root></app-root>
  <script
    src="/startup-loader.js"
    onerror="document.getElementById('site-loader')?.remove()"
  ></script>
</body>
</html>
